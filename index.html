<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://api.pwnedpasswords.com; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Passwords</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a84ff'/%3E%3Ccircle cx='12' cy='14' r='5' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M16 16 L26 16 M22 16 V21 M26 16 V20' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f5f7; --panel:#ffffff; --side:#ececf0; --text:#1d1d1f; --muted:#6e6e73; --line:#d9d9de;
  --accent:#0a6cff; --accent-text:#ffffff; --hover:rgba(0,0,0,.05); --sel:#0a6cff; --sel-text:#fff;
  --danger:#d70015; --warn:#b25e00; --ok:#1a7f37; --field:#f2f2f5; --shadow:0 10px 40px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1c1e; --panel:#2a2a2d; --side:#232326; --text:#f5f5f7; --muted:#a1a1a6; --line:#3d3d41;
    --accent:#3b8cff; --accent-text:#fff; --hover:rgba(255,255,255,.07); --sel:#2f6fe0; --sel-text:#fff;
    --danger:#ff6961; --warn:#ffb340; --ok:#4ccf6b; --field:#363639; --shadow:0 10px 40px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
svg{display:block}

/* ---------- buttons & fields ---------- */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:0;background:transparent;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea.input{resize:vertical;min-height:70px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.muted{color:var(--muted)}

/* ---------- lock screen ---------- */
#lock{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;padding:16px;overflow:auto}
.lockcard{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.lockcard .logo{width:56px;height:56px;border-radius:14px;background:var(--accent);display:grid;place-items:center;margin:0 auto 12px;color:#fff}
.lockcard h1{font-size:22px;text-align:center;margin:0 0 4px}
.lockcard p.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--muted)}
.chk input{margin-top:2px}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.meter{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--danger);transition:width .2s,background .2s}

/* ---------- main layout ---------- */
#app{display:grid;grid-template-columns:230px 330px 1fr;height:100vh}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-weight:600;font-size:16px}
.brand .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff}
#q{margin-bottom:10px}
#nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.navitem{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;border-radius:8px;padding:8px 10px;width:100%}
.navitem:hover{background:var(--hover)}
.navitem.active{background:var(--sel);color:var(--sel-text)}
.navitem .count{margin-left:auto;font-size:12px;opacity:.75}
.navitem .badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:600}
.sidefoot{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}

#listpane{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.listhead{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.listhead h2{margin:0;font-size:18px;flex:1}
#list{overflow:auto;flex:1;padding:0 8px 16px}
.letter{font-size:12px;font-weight:600;color:var(--muted);padding:12px 8px 4px;position:sticky;top:0;background:var(--panel)}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.row:hover{background:var(--hover)}
.row.active{background:var(--sel);color:var(--sel-text)}
.row.active .sub{color:rgba(255,255,255,.8)}
.row .txt{min-width:0;flex:1}
.row .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rcode{font-variant-numeric:tabular-nums;font-size:18px;letter-spacing:1px;font-weight:600}
.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.avatar.big{width:56px;height:56px;border-radius:14px;font-size:24px}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
.banner{margin:4px 6px 8px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:13px}
.banner .btn{margin-top:8px}
.sechead{font-weight:600;padding:14px 8px 4px;font-size:13px}
.seccard{margin:4px 6px 8px;padding:12px;border-radius:12px;background:var(--field);font-size:13px}
.seccard .btn{margin-top:8px}

#detailpane{overflow:auto;min-height:0;padding:28px 32px}
.dhead{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.dhead h2{margin:0;font-size:22px;word-break:break-word}
.dactions{margin-left:auto;display:flex;gap:8px;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:620px}
.field{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .k{width:120px;flex:none;color:var(--muted);font-size:13px}
.field .v{flex:1;min-width:0;word-break:break-all;white-space:pre-wrap}
.field .v.mono{font-family:"Cascadia Mono",Consolas,monospace}
.field a{color:var(--accent)}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;margin-left:6px;font-weight:600}
.tag.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.good{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.bigcode{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:3px;font-weight:600}
.ring{width:22px;height:22px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) var(--p,0%),var(--line) 0)}
.ring::after{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--panel);margin:4px}
.meta{margin-top:14px;color:var(--muted);font-size:12.5px;max-width:620px}
.backbtn{display:none}

/* ---------- modal ---------- */
#modalwrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:55;padding:16px}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.inline{display:flex;gap:8px}
.hr{height:1px;background:var(--line);margin:16px 0}
.setrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.setrow .grow{flex:1}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px;font-size:13px}
.optgrid label{display:flex;gap:6px;align-items:center}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
@media (prefers-color-scheme: dark){#toast{background:#f5f5f7;color:#1d1d1f}}

@media (max-width:900px){
  #app{grid-template-columns:200px 1fr}
  #detailpane{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;padding:18px}
  #app.showdetail #detailpane{display:block}
  .backbtn{display:inline-flex}
}
@media (max-width:620px){
  #app{grid-template-columns:1fr}
  #side{display:none}
  #app.shownav #side{display:flex;position:fixed;inset:0;z-index:15}
}
</style>
</head>
<body>
<noscript>This app needs JavaScript.</noscript>

<!-- Lock / setup screen -->
<div id="lock"></div>

<!-- Main app -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><span class="logo" id="brandlogo"></span><span>Passwords</span></div>
    <input id="q" class="input" type="search" placeholder="Search" aria-label="Search">
    <nav id="nav"></nav>
    <div class="sidefoot">
      <button class="navitem" id="btnSettings"></button>
      <button class="navitem" id="btnLock"></button>
    </div>
  </aside>
  <section id="listpane">
    <div class="listhead">
      <button class="iconbtn backbtn" id="btnNavBack" aria-label="Sections" title="Sections"></button>
      <h2 id="listtitle">All</h2>
      <button class="iconbtn" id="btnAdd" aria-label="Add" title="Add"></button>
    </div>
    <div id="list"></div>
  </section>
  <main id="detailpane"></main>
</div>

<div id="modalwrap" class="hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   Passwords for Windows — single-file, offline password manager.
   Crypto: PBKDF2-SHA256 (600k) -> AES-256-GCM via the browser's Web Crypto.
   Nothing is sent anywhere (except the optional leak check, k-anonymity).
   ===================================================================== */

/* ---------- tiny DOM helper (never uses innerHTML with user data) ---------- */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}
const $ = id => document.getElementById(id);

/* ---------- icons (static strings only) ---------- */
const ICONS = {
  key:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M17 6l3 3M14 9l2 2"/></svg>',
  keyBig:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M17 6l3 3M14 9l2 2"/></svg>',
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  wifi:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10.5 10.5 0 0 1 14 0M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>',
  shield:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
  trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>',
  gear:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  lock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  copy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  eye:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
};
function icon(name){ const s = h('span'); s.innerHTML = ICONS[name]; s.style.display = 'inline-flex'; return s; }
function setIcon(el, name){ el.replaceChildren(icon(name)); }

/* ---------- encoding helpers ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
function b64e(buf){ const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(str){ const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }

/* ---------- crypto ---------- */
const LS_KEY = 'pwvault.v1';
const ITER = 600000;
const AAD = enc.encode('pwvault/v1');

async function deriveKey(pw, salt, iter){
  const km = await crypto.subtle.importKey('raw', enc.encode(pw.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function sealPayload(key, salt, iter, payload){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv, additionalData:AAD }, key, enc.encode(JSON.stringify(payload)));
  return { v:1, kdf:'PBKDF2-SHA256', iter, salt:b64e(salt), iv:b64e(iv), ct:b64e(ct) };
}
function validBlob(b){
  return b && typeof b === 'object' && b.v === 1 && b.kdf === 'PBKDF2-SHA256' &&
    Number.isInteger(b.iter) && b.iter >= 100000 && b.iter <= 5000000 &&
    typeof b.salt === 'string' && typeof b.iv === 'string' && typeof b.ct === 'string';
}
async function openBlob(blob, pw){
  if (!validBlob(blob)) throw new Error('bad-format');
  const salt = b64d(blob.salt);
  const key = await deriveKey(pw, salt, blob.iter);
  let pt;
  try { pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(blob.iv), additionalData:AAD }, key, b64d(blob.ct)); }
  catch(e){ throw new Error('bad-password'); }
  const payload = JSON.parse(dec.decode(pt));
  if (!payload || !Array.isArray(payload.items)) throw new Error('bad-format');
  return { key, salt, iter:blob.iter, payload };
}

/* ---------- random / generator ---------- */
function randInt(max){
  const lim = Math.floor(4294967296 / max) * max;
  const a = new Uint32Array(1);
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % max;
}
function pick(s){ return s[randInt(s.length)]; }
function shuffle(arr){ for (let i = arr.length - 1; i > 0; i--){ const j = randInt(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const LOWER = 'abcdefghijkmnopqrstuvwxyz', UPPER = 'ABCDEFGHJKLMNPQRSTUVWXYZ', DIGITS = '23456789', SYMBOLS = '!@#$%^&*-_+=?';
/* Apple-style: three groups of six, e.g. "hupxoc-3hovDi-bejvik" */
function generateStrong(){
  const chars = [];
  for (let i = 0; i < 18; i++) chars.push(pick(LOWER));
  const pos = shuffle([...Array(18).keys()]);
  chars[pos[0]] = pick(DIGITS);
  chars[pos[1]] = pick(UPPER);
  const s = chars.join('');
  return s.slice(0, 6) + '-' + s.slice(6, 12) + '-' + s.slice(12);
}
function generateCustom(len, o){
  const sets = [LOWER];
  if (o.upper) sets.push(UPPER);
  if (o.digits) sets.push(DIGITS);
  if (o.symbols) sets.push(SYMBOLS);
  len = Math.max(len, sets.length);
  const all = sets.join('');
  const out = sets.map(s => pick(s));
  while (out.length < len) out.push(pick(all));
  return shuffle(out).join('');
}

/* ---------- password strength heuristics ---------- */
const COMMON = new Set(['password','123456','12345678','123456789','1234567890','12345','1234','qwerty','qwerty123','abc123','letmein','monkey','111111','000000','654321','123123','iloveyou','admin','welcome','login','princess','dragon','passw0rd','master','hello','freedom','whatever','qazwsx','trustno1','sunshine','football','baseball','superman','michael','shadow','password1','changeme','default','secret','guest','root','test','user','abc','abcd','abcde','abcdef']);
const COMMON_BASES = ['password','qwerty','letmein','iloveyou','welcome','admin','monkey','dragon','sunshine','football','baseball','superman','princess','changeme','passw0rd'];
function assess(pw){
  const reasons = [];
  if (!pw) return { weak:false, reasons, bits:0 };
  const lower = pw.toLowerCase();
  const base = lower.replace(/[^a-z]/g, '');
  if (COMMON.has(lower) || COMMON.has(base)) reasons.push('is a very common password');
  else if (COMMON_BASES.some(w => base.includes(w))) reasons.push('is built on a common word');
  if (pw.length < 8) reasons.push('is shorter than 8 characters');
  if (/^(.)\1+$/.test(pw)) reasons.push('repeats one character');

  const bits = pool ? pw.length * Math.log2(pool) : 0;

/* ---------- TOTP (RFC 6238) ---------- */
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

    if (u.hostname.toLowerCase() !== 'totp') throw new Error('Only time-based (TOTP) codes are supported.');
    secret = u.searchParams.get('secret') || '';
    const a = (u.searchParams.get('algorithm') || 'SHA1').toUpperCase().replace('SHA-', 'SHA');
    algo = { SHA1:'SHA-1', SHA256:'SHA-256', SHA512:'SHA-512' }[a];
    if (!algo) throw new Error('Unsupported code algorithm: ' + a);
    const d = parseInt(u.searchParams.get('digits') || '6', 10);
    if (![6,7,8].includes(d)) throw new Error('Unsupported number of digits.');
    digits = d;
    const p = parseInt(u.searchParams.get('period') || '30', 10);

  const bin = ((sig[off] & 0x7f) << 24) | (sig[off+1] << 16) | (sig[off+2] << 8) | sig[off+3];
  return String(bin % Math.pow(10, digits)).padStart(digits, '0');

/* ---------- security report ---------- */
function securityReport(){
  const logins = activeItems().filter(i => i.type === 'login' && i.password);
  const groups = new Map();
  for (const i of logins){ if (!groups.has(i.password)) groups.set(i.password, []); groups.get(i.password).push(i); }
  const reused = [], weak = [], leaked = [];
  for (const g of groups.values()) if (g.length > 1) reused.push(...g);
  for (const i of logins){
    const a = assess(i.password);
    if (a.weak) weak.push({ item:i, why:a.reasons[0] });
    if ((S.leaks.get(i.id) || 0) > 0) leaked.push({ item:i, n:S.leaks.get(i.id) });
  }
  const ids = new Set([...reused.map(i => i.id), ...weak.map(w => w.item.id), ...leaked.map(l => l.item.id)]);
  return { reused, weak, leaked, count: ids.size, total: logins.length };

async function checkLeaks(){

  for (const i of logins){
    const hash = await sha1hex(i.password), pre = hash.slice(0, 5), suf = hash.slice(5);
    if (!cache.has(pre)){
      const r = await fetch('https://api.pwnedpasswords.com/range/' + pre, { headers:{ 'Add-Padding':'true' }, cache:'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const map = new Map();

      cache.set(pre, map);
    }
    const n = cache.get(pre).get(suf) || 0;
    if (n > 0) S.leaks.set(i.id, n);
  }

}

let failCount = 0;
function buildUnlock(lock){

  const err = h('div', { class:'err', role:'alert' });

/* ---------- live verification codes ---------- */
let tickTimer = null;
function startTicker(){
  clearInterval(tickTimer);
  tick();
  tickTimer = setInterval(tick, 1000);
}
const codeCache = new Map(); // id -> {step, code}
async function tick(){
  if (!S.unlocked) return;
  const now = Date.now();
  const els = document.querySelectorAll('[data-code]');
  for (const el of els){
    const it = S.items.find(i => i.id === el.dataset.code);
    if (!it || !it.totp) continue;
    const step = Math.floor(now / 1000 / it.totp.period);
    let c = codeCache.get(it.id);
    if (!c || c.step !== step || c.sig !== it.totp.secret + it.totp.digits + it.totp.algo){
      try { c = { step, sig: it.totp.secret + it.totp.digits + it.totp.algo, code: await totpAt(it.totp, now) }; codeCache.set(it.id, c); }
      catch(e){ el.textContent = 'Error'; continue; }
    }
    el.textContent = fmtCode(c.code);
  }
  for (const r of document.querySelectorAll('[data-ring]')){
    const it = S.items.find(i => i.id === r.dataset.ring); if (!it || !it.totp) continue;
    const p = it.totp.period, left = p - ((now / 1000) % p);
    r.style.setProperty('--p', Math.round(left / p * 100) + '%');
    r.title = Math.ceil(left) + ' s left';
  }
}

function csvEscape(v){ v = v == null ? '' : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCsv(){
  confirmBox('Export unencrypted CSV?', 'The file will contain all your passwords in plain text. Anyone who opens it can read them. Delete it as soon as you have imported it elsewhere.', 'Export', () => {
    const rows = [['Title','URL','Username','Password','Notes','OTPAuth','Type']];
    for (const i of activeItems()){
      let otp = '';
      if (i.totp) otp = 'otpauth://totp/' + encodeURIComponent(titleOf(i)) + '?secret=' + i.totp.secret + '&algorithm=' + i.totp.algo.replace('-', '') + '&digits=' + i.totp.digits + '&period=' + i.totp.period;
      rows.push([i.title, i.website, i.username, i.password, i.notes, otp, i.type]);
    }
    download('passwords-export-' + stamp() + '.csv', '\ufeff' + rows.map(r => r.map(csvEscape).join(',')).join('\r\n') + '\r\n', 'text/csv');
    toast('CSV exported — delete it after use');
  });
}
function parseCsv(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], f = '', q = false, i = 0, any = false;
  while (i < text.length){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += c; i++; continue;
    }
    if (c === '"'){ q = true; any = true; i++; continue; }
    if (c === ','){ row.push(f); f = ''; any = true; i++; continue; }
    if (c === '\r' || c === '\n'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(f); f = ''; if (any || row.some(x => x !== '') ) rows.push(row); row = []; any = false; i++; continue;
    }
    f += c; any = true; i++;
  }
  if (any || f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function importCsv(){
  const text = await pickFile('.csv,text/csv'); if (text == null) return;
  const rows = parseCsv(text);
  if (rows.length < 2){ toast('That CSV has no rows.'); return; }
  const head = rows[0].map(x => x.trim().toLowerCase());
  const col = (...names) => head.findIndex(x => names.includes(x));
  const ci = { title:col('title','name'), url:col('url','website','login_uri','web site'), user:col('username','user name','login','login_username','user'), pw:col('password','login_password'), notes:col('notes','note','extra'), otp:col('otpauth','totp','login_totp'), type:col('type') };
  if (ci.pw < 0 && ci.user < 0 && ci.title < 0){ toast('Could not find Title / Username / Password columns.'); return; }
  const get = (r, i) => i >= 0 && r[i] != null ? r[i] : '';
  let added = 0, dup = 0, badOtp = 0;
  for (const r of rows.slice(1)){
    const rec = { id:newId(), type: get(r, ci.type).trim().toLowerCase() === 'wifi' ? 'wifi' : 'login', title:get(r, ci.title).trim(), website:get(r, ci.url).trim(), username:get(r, ci.user).trim(), password:get(r, ci.pw), notes:get(r, ci.notes).trim(), created:Date.now(), modified:Date.now() };
    if (!rec.title && !rec.website && !rec.username && !rec.password) continue;
    if (rec.type === 'wifi'){ rec.website = ''; rec.username = ''; }
    const o = get(r, ci.otp).trim();
    if (o && rec.type === 'login'){ try { const t = parseTotp(o); if (t) rec.totp = t; } catch(e){ badOtp++; } }
    if (S.items.some(x => !x.deleted && x.type === rec.type && x.title === rec.title && x.website === rec.website && x.username === rec.username && x.password === rec.password)){ dup++; continue; }
    S.items.push(rec); added++;
  }
  touch(); await persist(); render();
  toast('Imported ' + added + (dup ? ', skipped ' + dup + ' duplicate' + (dup > 1 ? 's' : '') : '') + (badOtp ? ', ' + badOtp + ' code key(s) ignored' : ''));
}

function openErase(){
  const t = h('input', { class:'input', type:'text', autocomplete:'off', placeholder:'Type ERASE to confirm', 'aria-label':'Type ERASE to confirm' });
  const go = h('button', { class:'btn danger', disabled:true, onclick:() => { try { localStorage.removeItem(LS_KEY); } catch(e){} closeModal(); showLock(); } }, 'Erase everything');
  t.addEventListener('input', () => go.disabled = t.value.trim() !== 'ERASE');
  openModal(h('div', { class:'modal' }, h('h3', { text:'Erase everything?' }),
    h('p', { class:'muted', text:'This permanently deletes the vault stored in this browser. If you have no backup, your passwords are gone for good.' }), t,
    h('div', { class:'actions' }, h('button', { class:'btn', onclick:closeModal }, 'Cancel'), go)));
}

/* ---------- wiring ---------- */
$('brandlogo').append(icon('key'));
setIcon($('btnSettings'), 'gear'); $('btnSettings').append(h('span', { text:'Settings' }));
setIcon($('btnLock'), 'lock'); $('btnLock').append(h('span', { text:'Lock' }));
setIcon($('btnAdd'), 'plus'); setIcon($('btnNavBack'), 'back');
$('btnSettings').addEventListener('click', openSettings);
$('btnLock').addEventListener('click', lockNow);
$('btnAdd').addEventListener('click', () => openEditor(null));
$('btnNavBack').addEventListener('click', () => $('app').classList.add('shownav'));
$('q').addEventListener('input', e => { S.q = e.target.value; if (S.view === 'security'){ S.view = 'all'; } renderNav(); renderList(); startTicker(); });
document.addEventListener('keydown', e => {
  if (!S.unlocked) return;
  if (e.key === 'Escape' && !$('modalwrap').classList.contains('hidden')) { closeModal(); return; }
  if (!$('modalwrap').classList.contains('hidden')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){ e.preventDefault(); $('q').focus(); $('q').select(); }
});

showLock();
</script>
</body>
